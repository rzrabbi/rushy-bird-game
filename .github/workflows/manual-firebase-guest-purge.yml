name: Manual Firebase Guest Purge
on:
  workflow_dispatch: # Allows manual trigger from GitHub UI at any time

jobs:
  purge-guests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Firebase Admin SDK
        run: npm install firebase-admin

      - name: Run Guest Purge Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/workflows/scripts/purge_guests.js

      - name: Publish Purge Report
        if: always()
        run: |
          if [ -f step_summary.md ]; then
            cat step_summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Purge failed or summary report not generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            REPO_NAME="${{ github.repository }}"
            REPO_URL="https://github.com/${{ github.repository }}"
            RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            
            if [ -f step_summary.md ]; then
              # Escape quotes and convert newlines for JSON payload
              SUMMARY_TEXT=$(cat step_summary.md | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
              PAYLOAD="{\"embeds\": [{\"title\": \"🧹 Guest Account Purge Completed\", \"description\": \"$SUMMARY_TEXT\\n\\n🔗 **Repository**: [$REPO_NAME]($REPO_URL)\\n📅 **Run Details**: [View Workflow Run]($RUN_URL)\", \"color\": 5814783}]}"
            else
              PAYLOAD="{\"embeds\": [{\"title\": \"❌ Guest Account Purge Failed\", \"description\": \"The guest account purge job failed or did not generate a report.\\n\\n🔗 **Repository**: [$REPO_NAME]($REPO_URL)\\n📅 **Run Details**: [View Workflow Run]($RUN_URL)\", \"color\": 15548997}]}"
            fi
            curl -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"
          else
            echo "DISCORD_WEBHOOK_URL is not set. Skipping Discord notification."
          fi
