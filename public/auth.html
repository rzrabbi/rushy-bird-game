<!DOCTYPE html>
<html>
<head>
    <title>Authenticating...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121214;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #3898ec;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p id="status">Authenticating, please wait...</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let code = urlParams.get('code');
        
        if (!code && window.location.hash) {
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            code = hashParams.get('code') || hashParams.get('access_token') || hashParams.get('id_token');
        }
        
        if (code) {
            if (window.opener) {
                // Send the code back to the Godot HTML5 game window
                window.opener.postMessage({ type: "google_auth_token", token: code }, "*");
                document.getElementById('status').innerText = "Success! Closing window...";
                setTimeout(() => {
                    window.close();
                }, 500);
            } else {
                document.getElementById('status').innerText = "Error: Game window not found. Please restart sign-in.";
            }
        } else {
            document.getElementById('status').innerText = "Error: No authentication code found in URL.";
        }
    </script>
</body>
</html>
